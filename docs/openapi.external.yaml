openapi: 3.0.3
info:
  title: Pipelogiq External API
  version: "0.6.0-preview.1"
  description: |
    External API used by SDK clients and workers.

    Pipeline creation through `/pipelines/idempotent` is the opt-in reliable
    creation contract. Its idempotency key is unique within an application and
    is retained for the lifetime of the pipeline. Reusing a key with a different
    creation request returns `409`. The legacy `/pipelines` route is preserved
    and is not idempotent.
servers:
  - url: http://localhost:8081
security:
  - ApiKeyAuth: []
paths:
  /pipelines:
    post:
      summary: Create a pipeline using the legacy non-idempotent contract
      description: |
        Preserved for existing SDK clients. Each successful request creates a
        new pipeline, even when the payload is identical. New integrations that
        must safely retry an unknown HTTP outcome should use
        `/pipelines/idempotent`.
      operationId: createPipelineLegacy
      tags:
        - Pipelines
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegacyPipelineCreateRequest"
      responses:
        "200":
          description: Pipeline created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineResponse"
        "400":
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Invalid API key in the request body

  /pipelines/idempotent:
    post:
      summary: Atomically create or resolve a pipeline by idempotency key
      description: |
        The key is scoped to the application authenticated by `X-API-Key` and
        is retained for the lifetime of the pipeline. Sequential and concurrent
        requests with the same key and the same creation intent return the same
        pipeline ID. Tracing metadata may change between retries. Reusing the
        key for a different creation intent returns `409`.
      operationId: createPipelineIdempotent
      tags:
        - Pipelines
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdempotentPipelineCreateRequest"
      responses:
        "201":
          description: A new pipeline was created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdempotentPipelineCreateResponse"
        "200":
          description: The existing pipeline for this application and key was returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdempotentPipelineCreateResponse"
        "400":
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Missing or invalid X-API-Key header
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: The key was already used for a different creation intent
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          description: Pipeline creation failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /pipelines/by-idempotency-key:
    post:
      summary: Find a pipeline by its application-scoped idempotency key
      description: |
        Uses a request body so the idempotency key is not placed in the URL or
        routine access logs.
      operationId: getPipelineByIdempotencyKey
      tags:
        - Pipelines
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PipelineIdempotencyLookupRequest"
      responses:
        "200":
          description: Pipeline status and stage details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineResponse"
        "400":
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Missing or invalid X-API-Key header
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: No pipeline exists for this application and key
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /pipelines/{pipelineId}:
    get:
      summary: Get pipeline status and stage execution details
      operationId: getPipeline
      tags:
        - Pipelines
      parameters:
        - $ref: "#/components/parameters/PipelineId"
      responses:
        "200":
          description: Pipeline status and stage details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineResponse"
        "400":
          description: Invalid pipeline ID
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Invalid API key
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: Pipeline belongs to another application
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Pipeline not found

  /pipelines/{pipelineId}/cancel:
    post:
      summary: Cancel a non-terminal pipeline
      description: |
        Atomically marks the authenticated application's pipeline and its
        unfinished stages as cancelled. Cancellation of an already-running
        handler is cooperative; stale results are fenced by execution metadata.
      operationId: cancelPipeline
      tags:
        - Pipelines
      parameters:
        - $ref: "#/components/parameters/PipelineId"
      responses:
        "200":
          description: Pipeline cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineResponse"
        "400":
          description: Invalid pipeline ID
        "401":
          description: Invalid API key
        "404":
          description: Pipeline not found for this application
        "409":
          description: Pipeline is already terminal and cannot be cancelled
        "504":
          description: Cancellation timed out

  /pipelines/{pipelineId}/stages:
    post:
      summary: Append stages to an existing pipeline
      operationId: appendPipelineStages
      tags:
        - Pipelines
      parameters:
        - $ref: "#/components/parameters/PipelineId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppendStagesRequest"
            examples:
              appendStages:
                value:
                  stages:
                    - stageName: agent.tool
                      stageHandlerName: AgentToolHandler
                      input: '{"toolName":"getOrder","args":{"id":"42"}}'
                      options:
                        runNextIfFailed: false
                        maxRetries: 3
                        retryInterval: 5
                        retryOnErrorCodes:
                          - TIMEOUT
                          - UPSTREAM_ERROR
                          - RATE_LIMIT_EXCEEDED
                        backoff: exponential
                        maxRetryInterval: 60
                        jitter: true
                      isEvent: false
      responses:
        "200":
          description: Stages appended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppendStagesResponse"
              examples:
                appended:
                  value:
                    stages:
                      - id: 9021
                        pipelineId: 1307
                        name: agent.tool
                        stageHandlerName: AgentToolHandler
                        status: NotStarted
                        createdAt: "2026-03-10T10:14:05Z"
                        input: '{"toolName":"getOrder","args":{"id":"42"}}'
                        nextStageId: null
                        isSkipped: false
                        isEvent: false
                        runNextIfCurrentFailed: false
        "400":
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Pipeline not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: Pipeline is terminal, append is not allowed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /stages/{stageId}/resume:
    post:
      summary: Resume a stage waiting for external approval
      operationId: resumeStageApproval
      tags:
        - Stages
      parameters:
        - $ref: "#/components/parameters/StageId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResumeStageRequest"
            examples:
              approved:
                value:
                  approved: true
              rejected:
                value:
                  approved: false
                  rejectionReason: User rejected payment mutation
      responses:
        "204":
          description: Stage resumed
        "400":
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Stage not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: Stage not waiting for approval or conflicting repeated decision
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /stages/{stageId}/lease/acquire:
    post:
      summary: Acquire the lease for a dispatched stage execution
      description: |
        Worker protocol endpoint. The worker session token binds the lease to
        the authenticated worker session. `acquired=false` is a successful
        response indicating that the delivery must not execute the handler.
      operationId: acquireStageLease
      tags:
        - Worker protocol
      security:
        - WorkerSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/StageId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StageLeaseRequest"
      responses:
        "200":
          description: Lease decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StageLeaseResponse"
        "400":
          description: Invalid stage ID or request body
        "401":
          description: Missing or invalid worker session token
        "500":
          description: Lease operation failed

  /stages/{stageId}/lease/renew:
    post:
      summary: Renew the lease for a running stage execution
      description: |
        Worker protocol endpoint. Renewal succeeds only for the current
        execution and lease owner. The worker must stop publishing a result if
        it loses the lease.
      operationId: renewStageLease
      tags:
        - Worker protocol
      security:
        - WorkerSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/StageId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StageLeaseRequest"
      responses:
        "200":
          description: Lease renewal decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StageLeaseResponse"
        "400":
          description: Invalid stage ID or request body
        "401":
          description: Missing or invalid worker session token
        "500":
          description: Lease operation failed

  /jobs/pull:
    post:
      summary: Pull the next stage job for a handler queue
      description: |
        HTTP gateway over one of the application's `StageNext` queues. The queue
        must belong to the authenticated application; any other queue is `403`.

        `waitSeconds` turns the request into a long poll. Zero, the default,
        returns `204` immediately when the queue is empty; a positive value waits
        up to that many seconds for a message before answering `204`.

        The response carries an in-flight `token`. Until the job is acked the
        message stays unacknowledged on the broker; if the token is not acked
        within `GATEWAY_VISIBILITY_TIMEOUT` the server requeues the message.
      operationId: pullJob
      tags:
        - Worker protocol
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PullJobRequest"
      responses:
        "200":
          description: A stage job was dequeued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PullJobResponse"
        "204":
          description: No message available before the deadline
        "400":
          description: Missing queue, or waitSeconds outside 0..20
        "401":
          description: Missing or invalid API key
        "403":
          description: Queue does not belong to this application
        "429":
          description: Too many in-flight messages; back off and retry
        "500":
          description: Pull failed

  /jobs/ack:
    post:
      summary: Acknowledge or requeue a pulled stage job
      description: |
        `requeue:false` acknowledges the message and removes it from the queue.
        Send it only after `POST /stages/{stageId}/result` returned `202`:
        acking earlier drops the job while its result is still unqueued.

        `requeue:true` returns the message to the queue for another delivery.
        Use it when the lease could not be acquired, or when the process is
        shutting down before handler execution started. Do not requeue after the
        handler ran and its result was accepted; that would execute it twice.

        A token that already expired is `404`. The sweeper has requeued the
        message, so a redelivery is already on its way and no action is needed.
      operationId: ackJob
      tags:
        - Worker protocol
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AckJobRequest"
      responses:
        "200":
          description: Acknowledgement applied
        "400":
          description: Missing token
        "404":
          description: Token unknown or already expired
        "500":
          description: Acknowledgement failed

  /stages/{stageId}/result:
    post:
      summary: Report a stage result over HTTP
      description: |
        Worker protocol endpoint for HTTP workers. The body is the same
        `stage_result` message an AMQP worker publishes, so retry policies,
        execution-ID fencing, WebSocket updates, and metrics behave identically.

        The API queues the message and returns `202` without inspecting stage
        state. A stale, duplicate, or terminal-stage result is accepted here and
        discarded by the result consumer, which is the existing AMQP contract.

        Acknowledge the pulled job (`POST /jobs/ack` with `requeue:false`) only
        after this endpoint returned `202`.
      operationId: postStageResult
      tags:
        - Worker protocol
      security:
        - WorkerSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/StageId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StageResultSubmit"
      responses:
        "202":
          description: Result queued for the stage result consumer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StageResultAccepted"
        "400":
          description: Validation failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Missing worker session token or invalid API key
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: Stage belongs to another application
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Stage not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "503":
          description: Message broker unavailable; retry the request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /schedules:
    get:
      summary: List the application's schedules
      operationId: listSchedules
      tags:
        - Schedules
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [Active, Paused, Archived]
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: A page of schedules, each with a recent-run health summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleListResponse"
        "400":
          description: Invalid status filter or limit
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Missing or invalid API key
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /schedules/{name}:
    put:
      summary: Create or update a schedule
      description: |
        Idempotent upsert keyed on the application-scoped, case-insensitive name.

        An unchanged body returns `200` without bumping `definitionVersion` or
        moving `nextRunAt`, so re-applying the same schedule on every deploy is a
        no-op. A changed body returns `200` with a new version and a re-planned
        next run. A new name returns `201`. Re-applying an archived schedule
        brings it back Active.

        `definition` is validated by the same rules as `POST /pipelines`.
      operationId: upsertSchedule
      tags:
        - Schedules
      parameters:
        - $ref: "#/components/parameters/ScheduleName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleUpsertRequest"
      responses:
        "201":
          description: A new schedule was created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "200":
          description: The existing schedule was updated or left unchanged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          description: Validation failed, with per-field messages
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Missing or invalid API key
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          description: The schedule could not be stored
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
    get:
      summary: Get one schedule
      operationId: getSchedule
      tags:
        - Schedules
      parameters:
        - $ref: "#/components/parameters/ScheduleName"
      responses:
        "200":
          description: Definition, policies, next and last run, health summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          description: Invalid schedule name
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Missing or invalid API key
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: No such schedule in this application
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /schedules/{name}/runs:
    get:
      summary: List a schedule's run history
      operationId: listScheduleRuns
      tags:
        - Schedules
      parameters:
        - $ref: "#/components/parameters/ScheduleName"
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: A page of runs, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleRunListResponse"
        "400":
          description: Invalid schedule name or limit
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Missing or invalid API key
        "404":
          description: No such schedule in this application
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /schedules/{name}/pause:
    post:
      summary: Pause a schedule
      description: Stops creating pipelines. The definition and history are kept.
      operationId: pauseSchedule
      tags:
        - Schedules
      parameters:
        - $ref: "#/components/parameters/ScheduleName"
      responses:
        "200":
          description: The paused schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "401":
          description: Missing or invalid API key
        "404":
          description: No such schedule in this application
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /schedules/{name}/resume:
    post:
      summary: Resume a schedule
      description: |
        Recomputes `nextRunAt` from now, so a schedule paused for a week does not
        wake up owing a week of ticks whatever its catch-up policy says.
      operationId: resumeSchedule
      tags:
        - Schedules
      parameters:
        - $ref: "#/components/parameters/ScheduleName"
      responses:
        "200":
          description: The resumed schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          description: The stored schedule can no longer be planned
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Missing or invalid API key
        "404":
          description: No such schedule in this application
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: The schedule has no future run (a Once schedule already past)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /schedules/{name}/archive:
    post:
      summary: Archive a schedule
      description: Terminal. Re-applying the definition with PUT brings it back Active.
      operationId: archiveSchedule
      tags:
        - Schedules
      parameters:
        - $ref: "#/components/parameters/ScheduleName"
      responses:
        "200":
          description: The archived schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "401":
          description: Missing or invalid API key
        "404":
          description: No such schedule in this application
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /schedules/{name}/trigger:
    post:
      summary: Run a schedule immediately
      description: |
        Creates a run with `trigger: Manual` right away. It does not move the
        schedule's cursor, and overlap and catch-up policies do not apply — a
        manual run was explicitly asked for. The optional `input` replaces the
        first stage's input.
      operationId: triggerSchedule
      tags:
        - Schedules
      parameters:
        - $ref: "#/components/parameters/ScheduleName"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleTriggerRequest"
      responses:
        "201":
          description: The manual run and its pipeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleTriggerResponse"
        "400":
          description: Invalid payload
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Missing or invalid API key
        "404":
          description: No such schedule in this application
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: The schedule is archived
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /version:
    get:
      summary: Server version and licence tier
      operationId: getVersion
      tags:
        - System
      security: []
      responses:
        "200":
          description: Build metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionInfo"

  /logs:
    post:
      summary: Record an application log line
      description: |
        Stores a free-form log line against the calling application. Keywords
        make the line searchable from the dashboard.
      operationId: saveLog
      tags:
        - Application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogRequest"
      responses:
        "200":
          description: Log line stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogResponse"
        "400":
          description: Malformed body
        "401":
          description: Missing or invalid API key

  /workers/bootstrap:
    post:
      summary: Register a worker and receive its session
      description: |
        Called once when a worker process starts. The response carries the
        session token every later worker-protocol request must send as
        `X-Worker-Session`, the queue topology, and — when the operator allows
        hand-out — the broker address for AMQP workers. HTTP workers ignore
        `messageBroker` and use `/jobs/pull`.
      operationId: bootstrapWorker
      tags:
        - Worker protocol
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerBootstrapRequest"
      responses:
        "200":
          description: Worker registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerBootstrapResponse"
        "400":
          description: Malformed body
        "401":
          description: Missing or invalid API key
        "503":
          description: Broker hand-out is enabled but no broker address is configured

  /workers/heartbeat:
    post:
      summary: Report worker liveness and counters
      operationId: workerHeartbeat
      tags:
        - Worker protocol
      security:
        - ApiKeyAuth: []
          WorkerSessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerHeartbeatRequest"
      responses:
        "200":
          description: Heartbeat recorded
        "400":
          description: Malformed body
        "401":
          description: Missing or invalid API key or worker session

  /workers/events:
    post:
      summary: Append worker lifecycle events
      description: |
        Batched, at most `WORKER_EVENTS_MAX_BATCH` events per call. Events feed
        the dashboard's worker activity feed and alerting.
      operationId: workerEvents
      tags:
        - Worker protocol
      security:
        - ApiKeyAuth: []
          WorkerSessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerEventsRequest"
      responses:
        "200":
          description: Events recorded
        "400":
          description: Malformed body or batch too large
        "401":
          description: Missing or invalid API key or worker session

  /workers/shutdown:
    post:
      summary: Announce a graceful shutdown
      operationId: workerShutdown
      tags:
        - Worker protocol
      security:
        - ApiKeyAuth: []
          WorkerSessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerShutdownRequest"
      responses:
        "200":
          description: Worker marked stopped
        "400":
          description: Malformed body
        "401":
          description: Missing or invalid API key or worker session

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    WorkerSessionAuth:
      type: apiKey
      in: header
      name: X-Worker-Session
      description: Session token returned by worker bootstrap.

  parameters:
    PipelineId:
      name: pipelineId
      in: path
      required: true
      description: Pipeline ID (> 0)
      schema:
        type: integer
        minimum: 1
    ScheduleName:
      name: name
      in: path
      required: true
      description: Application-scoped schedule name, matched case-insensitively.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    StageId:
      name: stageId
      in: path
      required: true
      description: Stage ID (> 0)
      schema:
        type: integer
        minimum: 1

  schemas:
    PipelineDefinition:
      type: object
      required:
        - name
        - stages
      properties:
        apiKey:
          type: string
          writeOnly: true
          deprecated: true
          description: Required only by the legacy `/pipelines` endpoint; ignored by the idempotent endpoint.
        name:
          type: string
          minLength: 1
          maxLength: 255
        traceId:
          type: string
          maxLength: 36
          description: Optional tracing identifier; not part of idempotency intent comparison.
        policies:
          type: array
          items:
            type: object
            additionalProperties: true
        stages:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/StageCreate"
        pipelineKeywords:
          type: array
          maxItems: 64
          items:
            $ref: "#/components/schemas/PipelineKeyword"
        pipelineContextItems:
          type: array
          maxItems: 64
          description: Do not use pipeline context as the consumer's sole business system of record.
          items:
            $ref: "#/components/schemas/ContextItem"

    LegacyPipelineCreateRequest:
      allOf:
        - $ref: "#/components/schemas/PipelineDefinition"
        - type: object
          required:
            - apiKey

    IdempotentPipelineCreateRequest:
      allOf:
        - $ref: "#/components/schemas/PipelineDefinition"
        - type: object
          required:
            - idempotencyKey
          properties:
            idempotencyKey:
              type: string
              minLength: 1
              maxLength: 200
              description: Application-scoped key retained for the lifetime of the pipeline.

    IdempotentPipelineCreateResponse:
      type: object
      required:
        - pipeline
        - created
        - wasExisting
      properties:
        pipeline:
          $ref: "#/components/schemas/PipelineResponse"
        created:
          type: boolean
          description: True only when this request inserted the pipeline.
        wasExisting:
          type: boolean
          description: True when an existing pipeline for the key was returned.

    PipelineIdempotencyLookupRequest:
      type: object
      required:
        - idempotencyKey
      properties:
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 200

    PipelineResponse:
      type: object
      required:
        - id
        - name
        - status
        - createdAt
        - isTerminal
      properties:
        id:
          type: integer
        name:
          type: string
        traceId:
          type: string
        status:
          type: string
          enum:
            - NotStarted
            - Pending
            - Running
            - Paused
            - Completed
            - Failed
            - Cancelled
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          nullable: true
        applicationId:
          type: integer
        stageStatuses:
          type: array
          items:
            type: string
        stages:
          type: array
          items:
            $ref: "#/components/schemas/StageResponse"
        pipelineContextItems:
          type: array
          description: Sensitive values are returned as `[REDACTED]` while preserving `isSensitive=true`.
          items:
            $ref: "#/components/schemas/ContextItem"
        pipelineKeywords:
          type: array
          items:
            $ref: "#/components/schemas/PipelineKeyword"
        isEvent:
          type: boolean
        idempotencyKey:
          type: string
          description: Present for pipelines created through the idempotent contract.
        isTerminal:
          type: boolean
          description: True for Completed, Failed, or Cancelled pipeline status.
        wasExisting:
          type: boolean
          description: Compatibility field; creation outcome is authoritative in the idempotent response wrapper.

    StageCreate:
      type: object
      required:
        - stageName
        - stageHandlerName
      properties:
        stageName:
          type: string
          minLength: 1
          maxLength: 255
        stageHandlerName:
          type: string
          minLength: 1
          maxLength: 300
        description:
          type: string
          maxLength: 255
        input:
          type: string
          description: JSON-serialized input payload, at most 262144 bytes.
        policies:
          type: array
          items:
            type: object
            additionalProperties: true
        options:
          $ref: "#/components/schemas/StageOptions"
        isEvent:
          type: boolean
        runNextIfFailed:
          type: boolean

    StageInfo:
      allOf:
        - $ref: "#/components/schemas/StageCreate"
        - type: object
          properties:
            stageId:
              type: integer
              nullable: true
              description: Compatibility field from SDK, ignored by server.
            pipelineId:
              type: integer
              nullable: true
              description: Compatibility field from SDK, ignored by server.
            runNextIfCurrentFailed:
              type: boolean
              description: Compatibility alias for runNextIfFailed.

    StageOptions:
      type: object
      properties:
        runNextIfFailed:
          type: boolean
        retryInterval:
          type: integer
          minimum: 0
          description: Base retry delay in seconds.
        maxRetries:
          type: integer
          minimum: 0
          description: Maximum number of automatic retries after the first execution.
        timeOut:
          type: integer
          minimum: 1
          description: Handler timeout in seconds.
        retryOnErrorCodes:
          type: array
          description: |
            When non-empty, StageOptions retries only matching error codes.
            Terminal codes such as BUSINESS_REJECTED, VALIDATION_ERROR,
            INVALID_STATE, and MISSING_REQUIRED_DATA are never retried
            automatically.
          items:
            type: string
            minLength: 1
        backoff:
          type: string
          enum:
            - fixed
            - linear
            - exponential
          default: fixed
        maxRetryInterval:
          type: integer
          minimum: 1
          description: Maximum retry delay in seconds.
        jitter:
          type: boolean
          default: false
        dependsOn:
          type: array
          items:
            type: string
        runInParallelWith:
          type: array
          items:
            type: string
        failIfOutputEmpty:
          type: boolean
        notifyOnFailure:
          type: boolean
        runAsUser:
          type: string

    StageResponse:
      type: object
      required:
        - id
        - pipelineId
        - name
        - createdAt
        - isTerminal
      properties:
        id:
          type: integer
        pipelineId:
          type: integer
        spanId:
          type: string
        name:
          type: string
        stageHandlerName:
          type: string
        description:
          type: string
        status:
          type: string
          enum:
            - NotStarted
            - Running
            - Pending
            - RetryScheduled
            - Throttled
            - WaitingForApproval
            - Completed
            - Failed
            - Skipped
            - Cancelled
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
        nextRetryAt:
          type: string
          format: date-time
          nullable: true
        output:
          type: string
          nullable: true
        input:
          type: string
          nullable: true
        isSkipped:
          type: boolean
        isEvent:
          type: boolean
        nextStageId:
          type: integer
          nullable: true
        logs:
          type: array
          items:
            $ref: "#/components/schemas/StageLog"
        options:
          $ref: "#/components/schemas/StageOptions"
        failureCount:
          type: integer
          minimum: 0
        lastFailedAt:
          type: string
          format: date-time
          nullable: true
        hasFailureHistory:
          type: boolean
        attempt:
          type: integer
          minimum: 0
          description: Stable 1-based execution attempt for the current dispatched execution; zero before first dispatch.
        retryAttempt:
          type: integer
          minimum: 0
          description: Number of retries scheduled so far.
        lastErrorCode:
          type: string
          description: Last handler or timeout error code.
        failureDisposition:
          type: string
          enum:
            - retryable
            - terminal
        isTerminal:
          type: boolean
          description: True for Completed, Failed, Skipped, or Cancelled stage status.

    ContextItem:
      type: object
      required:
        - key
        - value
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 300
        value:
          type: string
          description: At most 65536 bytes. Returned as `[REDACTED]` when isSensitive is true.
        valueType:
          type: string
        isSensitive:
          type: boolean
          default: false
          description: Marks the value for redaction from status responses and persisted logs.

    PipelineKeyword:
      type: object
      required:
        - key
        - value
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 300
        value:
          type: string
          minLength: 1
          maxLength: 300

    StageLog:
      type: object
      required:
        - message
        - created
      properties:
        id:
          type: integer
        stageId:
          type: integer
        message:
          type: string
        logLevel:
          type: string
        created:
          type: string
          format: date-time

    AppendStagesRequest:
      type: object
      required:
        - stages
      properties:
        stages:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/StageInfo"

    AppendStagesResponse:
      type: object
      required:
        - stages
      properties:
        stages:
          type: array
          items:
            $ref: "#/components/schemas/StageDto"

    StageDto:
      type: object
      required:
        - id
        - pipelineId
        - name
        - stageHandlerName
        - status
        - createdAt
        - isSkipped
        - isEvent
        - runNextIfCurrentFailed
      properties:
        id:
          type: integer
        pipelineId:
          type: integer
        name:
          type: string
        stageHandlerName:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        input:
          type: string
        nextStageId:
          type: integer
          nullable: true
        isSkipped:
          type: boolean
        isEvent:
          type: boolean
        runNextIfCurrentFailed:
          type: boolean
        finishedAt:
          type: string
          format: date-time
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true

    ResumeStageRequest:
      type: object
      required:
        - approved
      properties:
        approved:
          type: boolean
        rejectionReason:
          type: string
          nullable: true

    StageLeaseRequest:
      type: object
      required:
        - executionId
        - workerId
      properties:
        executionId:
          type: string
          minLength: 1
          description: Opaque execution token received in the stage delivery.
        workerId:
          type: string
          minLength: 1
          description: Worker ID associated with the authenticated worker session.

    StageLeaseResponse:
      type: object
      required:
        - acquired
      properties:
        acquired:
          type: boolean
        attempt:
          type: integer
          minimum: 1
          description: Execution attempt accepted by the server.
        leaseExpiresAt:
          type: string
          format: date-time
          nullable: true
        reason:
          type: string
          description: Machine-readable explanation when acquired is false.

    PullJobRequest:
      type: object
      required:
        - queue
      properties:
        queue:
          type: string
          description: "StageNext queue of this application: app_{applicationId}_{handler}_StageNext."
        waitSeconds:
          type: integer
          minimum: 0
          maximum: 20
          default: 0
          description: Seconds to wait for a message before answering 204.

    PullJobResponse:
      type: object
      required:
        - token
        - queue
        - payload
      properties:
        token:
          type: string
          description: In-flight token to pass to /jobs/ack.
        queue:
          type: string
        messageId:
          type: string
        payload:
          type: object
          additionalProperties: true
          description: The StageNext message for this delivery.
        headers:
          type: object
          additionalProperties: true

    AckJobRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          minLength: 1
        requeue:
          type: boolean
          default: false
          description: True returns the message to the queue instead of acknowledging it.

    StageResultSubmit:
      type: object
      required:
        - stageId
        - executionId
        - attempt
        - isSuccess
      properties:
        pipelineId:
          type: integer
          nullable: true
          description: Pipeline the stage belongs to, as delivered in the stage job.
        stageId:
          type: integer
          minimum: 1
          description: Must equal the stageId in the route.
        executionId:
          type: string
          minLength: 1
          description: Execution token from the stage delivery; the consumer fences on it.
        attempt:
          type: integer
          minimum: 1
          description: Execution attempt accepted by the lease.
        isSuccess:
          type: boolean
        result:
          type: string
          description: Handler output, at most 262144 bytes.
        isWaitingForApproval:
          type: boolean
          description: Parks the stage in WaitingForApproval instead of completing it.
        errorCode:
          type: string
          description: Failure classification; must not contain control characters.
        retryable:
          type: boolean
          nullable: true
          description: Overrides the classification derived from errorCode.
        nextStageId:
          type: integer
          nullable: true
        runNextIfCurrentFailed:
          type: boolean
        logs:
          type: array
          items:
            $ref: "#/components/schemas/StageResultLog"
        contextItems:
          type: array
          items:
            $ref: "#/components/schemas/ContextItem"
        appendedStages:
          type: array
          items:
            $ref: "#/components/schemas/StageInfo"

    StageResultLog:
      type: object
      required:
        - message
      properties:
        message:
          type: string
        logLevel:
          type: string
        created:
          type: string
          format: date-time

    StageResultAccepted:
      type: object
      required:
        - accepted
        - stageId
      properties:
        accepted:
          type: boolean
        stageId:
          type: integer
        executionId:
          type: string

    ScheduleUpsertRequest:
      type: object
      required:
        - kind
        - definition
      properties:
        kind:
          type: string
          enum: [Cron, Interval, Once]
        cronExpression:
          type: string
          description: |
            Standard 5-field cron, or @every <duration>, @hourly, @daily,
            @midnight. Six-field (seconds) expressions are not accepted.
        timeZone:
          type: string
          default: UTC
          description: IANA zone. Ticks are computed here and stored in UTC.
        intervalSeconds:
          type: integer
          minimum: 10
          nullable: true
        runAt:
          type: string
          format: date-time
          nullable: true
          description: Required for Once, and must be in the future.
        overlapPolicy:
          type: string
          enum: [Skip, Queue, Replace]
          default: Skip
        catchupPolicy:
          type: string
          enum: [None, One, All]
          default: None
        catchupMax:
          type: integer
          minimum: 1
          maximum: 1000
          default: 10
        jitterSeconds:
          type: integer
          minimum: 0
          maximum: 3600
          default: 0
        definition:
          $ref: "#/components/schemas/PipelineDefinition"

    Schedule:
      type: object
      required:
        - id
        - applicationId
        - name
        - status
        - kind
        - timeZone
        - definition
        - definitionVersion
        - overlapPolicy
        - catchupPolicy
        - catchupMax
        - jitterSeconds
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int64
        applicationId:
          type: integer
        name:
          type: string
        status:
          type: string
          enum: [Active, Paused, Archived]
        kind:
          type: string
          enum: [Cron, Interval, Once]
        cronExpression:
          type: string
        timeZone:
          type: string
        intervalSeconds:
          type: integer
          nullable: true
        runAt:
          type: string
          format: date-time
          nullable: true
        definition:
          $ref: "#/components/schemas/PipelineDefinition"
        definitionVersion:
          type: integer
          description: Incremented only when something that changes behaviour changed.
        overlapPolicy:
          type: string
          enum: [Skip, Queue, Replace]
        catchupPolicy:
          type: string
          enum: [None, One, All]
        catchupMax:
          type: integer
        jitterSeconds:
          type: integer
        nextRunAt:
          type: string
          format: date-time
          nullable: true
        lastRunAt:
          type: string
          format: date-time
          nullable: true
        lastRunStatus:
          type: string
          enum: [Created, Skipped, Failed]
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        health:
          $ref: "#/components/schemas/ScheduleHealth"

    ScheduleHealth:
      type: object
      description: Summary of the last 20 runs, for the dashboard list.
      properties:
        recentRuns:
          type: integer
        recentFailed:
          type: integer
        recentSkipped:
          type: integer
        outcomes:
          type: array
          maxItems: 20
          description: Newest first.
          items:
            type: string
            enum: [Created, Skipped, Failed]
        lagSeconds:
          type: number
          nullable: true

    ScheduleRun:
      type: object
      required:
        - id
        - scheduleId
        - scheduledFor
        - firedAt
        - trigger
        - outcome
        - definitionVersion
        - lagSeconds
      properties:
        id:
          type: integer
          format: int64
        scheduleId:
          type: integer
          format: int64
        scheduledFor:
          type: string
          format: date-time
          description: The planned tick.
        firedAt:
          type: string
          format: date-time
        trigger:
          type: string
          enum: [Cron, Interval, Once, Manual, Catchup]
        outcome:
          type: string
          enum: [Created, Skipped, Failed]
        skipReason:
          type: string
          enum: [Overlap, Paused, Catchup]
        pipelineId:
          type: integer
          nullable: true
        definitionVersion:
          type: integer
        error:
          type: string
          description: Present when outcome is Failed. The schedule keeps ticking.
        lagSeconds:
          type: number
          description: firedAt minus scheduledFor.
        pipelineStatus:
          type: string
        pipelineFinishedAt:
          type: string
          format: date-time
          nullable: true

    ScheduleListResponse:
      type: object
      required:
        - schedules
      properties:
        schedules:
          type: array
          items:
            $ref: "#/components/schemas/Schedule"
        nextCursor:
          type: string

    ScheduleRunListResponse:
      type: object
      required:
        - runs
      properties:
        runs:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleRun"
        nextCursor:
          type: string

    ScheduleTriggerRequest:
      type: object
      properties:
        input:
          description: Optional replacement for the first stage's input.
          oneOf:
            - type: object
              additionalProperties: true
            - type: string

    ScheduleTriggerResponse:
      type: object
      required:
        - runId
        - pipelineId
        - trigger
      properties:
        runId:
          type: integer
          format: int64
        pipelineId:
          type: integer
        trigger:
          type: string
          enum: [Manual]

    ProblemDetails:
      type: object
      required:
        - title
        - status
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        traceId:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    VersionInfo:
      type: object
      properties:
        version: { type: string, example: v0.6.0-preview.1 }
        commit: { type: string }
        buildDate: { type: string }
        goVersion: { type: string }
        tier: { type: string, enum: [community, pro, enterprise] }

    LogRequest:
      type: object
      properties:
        message: { type: string }
        logLevel: { type: string, example: INFO }
        created: { type: string, format: date-time }
        keywords:
          type: array
          items: { $ref: "#/components/schemas/PipelineKeyword" }

    LogResponse:
      type: object
      properties:
        id: { type: integer }
        applicationId: { type: integer }
        message: { type: string }
        logLevel: { type: string }
        created: { type: string, format: date-time }
        keywords:
          type: array
          items: { $ref: "#/components/schemas/PipelineKeyword" }

    WorkerBootstrapRequest:
      type: object
      required: [workerName]
      properties:
        workerName: { type: string }
        instanceId: { type: string, description: Stable per process; a restart with the same id reuses the worker record }
        workerVersion: { type: string }
        sdkVersion: { type: string }
        environment: { type: string }
        hostName: { type: string }
        pid: { type: integer }
        supportedHandlers:
          type: array
          items: { type: string }
        capabilities: { type: object, additionalProperties: true }
        metadata: { type: object, additionalProperties: true }

    WorkerBootstrapResponse:
      type: object
      properties:
        workerId: { type: string }
        workerSessionToken: { type: string, description: Send as X-Worker-Session on every worker-protocol request }
        configVersion: { type: string }
        application:
          type: object
          properties:
            applicationId: { type: integer }
            applicationName: { type: string }
            appId: { type: string, description: Queue prefix for this application }
        messageBroker:
          type: object
          description: Present for AMQP workers. connectionString is empty when the operator disabled hand-out (WORKER_BROKER_HANDOUT=false).
          properties:
            type: { type: string, example: rabbitmq }
            connectionString: { type: string }
            prefetch: { type: integer }
            topologyOwnership: { type: string, enum: [server-owned, client-owned] }
            dlqEnabled: { type: boolean }
            dlqTtlSec: { type: integer }
        queues:
          type: object
          properties:
            stageResult: { type: string }
            stageSetStatus: { type: string }
            stageUpdatedFanout: { type: string }
            stageNextPattern: { type: string, example: "{appId}.stage.{handler}" }
        heartbeat:
          type: object
          properties:
            intervalSec: { type: integer }
            offlineAfterSec: { type: integer }
        observability:
          type: object
          properties:
            traceLinkTemplate: { type: string }
            logsLinkTemplate: { type: string }

    WorkerHeartbeatRequest:
      type: object
      required: [workerId, state]
      properties:
        workerId: { type: string }
        state: { type: string, enum: [starting, ready, degraded, stopping, stopped] }
        uptimeSec: { type: integer }
        brokerConnected: { type: boolean }
        inFlightJobs: { type: integer }
        jobsProcessed: { type: integer }
        jobsFailed: { type: integer }
        queueLag: { type: integer }
        cpuPercent: { type: number }
        memoryMb: { type: number }
        lastError: { type: string }
        message: { type: string }
        metadata: { type: object, additionalProperties: true }

    WorkerEventsRequest:
      type: object
      required: [workerId, events]
      properties:
        workerId: { type: string }
        events:
          type: array
          items:
            type: object
            required: [level, eventType, message]
            properties:
              ts: { type: string, format: date-time }
              level: { type: string, enum: [DEBUG, INFO, WARN, ERROR] }
              eventType: { type: string, example: worker.state_changed }
              message: { type: string }
              details: { type: object, additionalProperties: true }

    WorkerShutdownRequest:
      type: object
      required: [workerId]
      properties:
        workerId: { type: string }
        reason: { type: string }
