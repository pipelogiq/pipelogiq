version: "3.9"

# Full stack using pre-built images from GitHub Container Registry.
# No local build required — pulls ghcr.io/pipelogiq/* images.
#
# Usage:
#   docker network create pipelogiq 2>/dev/null || true
#   cp .env.example .env
#   docker compose -f infra/compose/docker-compose.registry.yml up -d
#
# Pin a specific release with PIPELOGIQ_VERSION:
#   PIPELOGIQ_VERSION=v0.5.0-preview.1 docker compose -f infra/compose/docker-compose.registry.yml up -d
#
# Tracing is optional. Tempo and Grafana only start with the observability
# profile; a host that already runs Grafana Alloy or another collector should
# leave the profile off and point OTEL_EXPORTER_OTLP_ENDPOINT at it instead:
#   docker compose -f infra/compose/docker-compose.registry.yml --profile observability up -d
#
# Published ports. Only these two are reachable from the host:
#   3300 -> dashboard (put an authenticating reverse proxy in front of it)
#   8081 -> external API (API-key authenticated)
# Postgres (5432), RabbitMQ (5672/15672), the internal API (8080), and the
# metrics listeners (9090/9091) stay on the pipelogiq network. Reach them with
# `docker compose exec` or by attaching a container to the network. Publishing
# any of them exposes an unauthenticated administrative surface.
#
# Co-hosting with another Compose project: both projects join the external
# `pipelogiq` network, and that project's reverse proxy addresses these services
# by container name — pipelogiq-app:80 for the dashboard, pipelogiq-app:8081 for
# the external API. See docs/quickstart.md for the Caddy snippet.
#
# Resource limits are deployment-specific and therefore not set here. On a
# shared VPS, add them per service under the Compose v2 non-swarm keys:
#   mem_limit: 1g        # Postgres: 1-2g
#   cpus: "1.0"          # RabbitMQ: 512m / 0.5
#                        # pipelogiq-app and -worker: 512m / 0.5 each

networks:
  pipelogiq:
    external: true

services:
  pipelogiq-postgres:
    image: postgres:16-alpine
    container_name: pipelogiq-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pipelogiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pipelogiq}
      POSTGRES_DB: ${POSTGRES_DB:-pipelogiq}
    # Not published. Uncomment only for local debugging, never in production.
    # ports:
    #   - "5441:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - pipelogiq
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pipelogiq} -d ${POSTGRES_DB:-pipelogiq}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pipelogiq-rabbitmq:
    image: rabbitmq:3.13-management
    container_name: pipelogiq-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    # Neither AMQP nor the management UI is published. The management UI has no
    # authentication worth exposing on a public host.
    # ports:
    #   - "5672:5672"
    #   - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - pipelogiq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pipelogiq-tempo:
    image: grafana/tempo:2.7.2
    container_name: pipelogiq-tempo
    profiles: ["observability"]
    user: root
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ../observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/tmp/tempo
    # OTLP is consumed from inside the pipelogiq network only.
    # ports:
    #   - "3200:3200"
    #   - "4317:4317"
    #   - "4318:4318"
    networks:
      - pipelogiq
    restart: unless-stopped

  pipelogiq-grafana:
    image: grafana/grafana:11.2.2
    container_name: pipelogiq-grafana
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      pipelogiq-tempo:
        condition: service_started
    # Reach Grafana through the reverse proxy, or with an SSH tunnel.
    # ports:
    #   - "3100:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - pipelogiq
    restart: unless-stopped

  pipelogiq-app:
    image: ghcr.io/pipelogiq/pipelogiq-app:${PIPELOGIQ_VERSION:-latest}
    container_name: pipelogiq-app
    environment:
      APP_VERSION: ${PIPELOGIQ_VERSION:-latest}
      APP_ID: ${APP_ID:-PipelogiqTest}
      DATABASE_URL: ${DATABASE_URL:-postgres://pipelogiq:pipelogiq@pipelogiq-postgres:5432/pipelogiq?sslmode=disable}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@pipelogiq-rabbitmq:5672/}
      HTTP_ADDR: ":8080"
      EXTERNAL_HTTP_ADDR: ":8081"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env to a unique random value of at least 32 characters}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      GATEWAY_VISIBILITY_TIMEOUT: ${GATEWAY_VISIBILITY_TIMEOUT:-60s}
      GATEWAY_MAX_INFLIGHT: ${GATEWAY_MAX_INFLIGHT:-128}
      RABBIT_PREFETCH: ${RABBIT_PREFETCH:-10}
      RABBIT_DLQ_ENABLED: ${RABBIT_DLQ_ENABLED:-true}
      RABBIT_DLQ_TTL: ${RABBIT_DLQ_TTL:-30s}
      WORKER_RABBITMQ_URL: ${WORKER_RABBITMQ_URL:-}
      WORKER_BROKER_HANDOUT: ${WORKER_BROKER_HANDOUT:-true}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      ADMIN_FIRST_NAME: ${ADMIN_FIRST_NAME:-Admin}
      ADMIN_LAST_NAME: ${ADMIN_LAST_NAME:-User}
      # A fresh host provisions its application and API key from here instead of
      # dashboard clicks. Both are ignored once the application exists.
      BOOTSTRAP_APPLICATION_NAME: ${BOOTSTRAP_APPLICATION_NAME:-}
      BOOTSTRAP_APPLICATION_APP_ID: ${BOOTSTRAP_APPLICATION_APP_ID:-}
      BOOTSTRAP_API_KEY: ${BOOTSTRAP_API_KEY:-}
      # Empty means Community, which is a complete deployment for one developer.
      PIPELOGIQ_LICENSE: ${PIPELOGIQ_LICENSE:-}
      SSO_ISSUER: ${SSO_ISSUER:-}
      SSO_CLIENT_ID: ${SSO_CLIENT_ID:-}
      SSO_CLIENT_SECRET: ${SSO_CLIENT_SECRET:-}
      SSO_GROUP_CLAIM: ${SSO_GROUP_CLAIM:-}
      SSO_GROUP_ROLE_MAP: ${SSO_GROUP_ROLE_MAP:-}
      AUDIT_EXPORT_SIGNING_KEY: ${AUDIT_EXPORT_SIGNING_KEY:-}
      LIQUIBASE_ENABLED: ${LIQUIBASE_ENABLED:-true}
      LIQUIBASE_URL: ${LIQUIBASE_URL:-jdbc:postgresql://pipelogiq-postgres:5432/${POSTGRES_DB:-pipelogiq}}
      LIQUIBASE_USERNAME: ${POSTGRES_USER:-pipelogiq}
      LIQUIBASE_PASSWORD: ${POSTGRES_PASSWORD:-pipelogiq}
      LIQUIBASE_CHANGELOG_FILE: ${LIQUIBASE_CHANGELOG_FILE:-/app/database/changelog.xml}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-pipelogiq-app}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE:-true}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1}
    depends_on:
      pipelogiq-postgres:
        condition: service_healthy
      pipelogiq-rabbitmq:
        condition: service_healthy
    ports:
      - "3300:80"
      - "8081:8081"
    networks:
      - pipelogiq
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pipelogiq-worker:
    image: ghcr.io/pipelogiq/pipelogiq-worker:${PIPELOGIQ_VERSION:-latest}
    container_name: pipelogiq-worker
    environment:
      APP_VERSION: ${PIPELOGIQ_VERSION:-latest}
      APP_ID: ${APP_ID:-PipelogiqTest}
      DATABASE_URL: ${DATABASE_URL:-postgres://pipelogiq:pipelogiq@pipelogiq-postgres:5432/pipelogiq?sslmode=disable}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@pipelogiq-rabbitmq:5672/}
      WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-1s}
      STAGE_ACTIVE_TIMEOUT: ${STAGE_ACTIVE_TIMEOUT:-}
      STAGE_PENDING_TIMEOUT: ${STAGE_PENDING_TIMEOUT:-}
      RABBIT_PREFETCH: ${RABBIT_PREFETCH:-5}
      RABBIT_DLQ_ENABLED: ${RABBIT_DLQ_ENABLED:-true}
      RABBIT_DLQ_TTL: ${RABBIT_DLQ_TTL:-30s}
      METRICS_ADDR: ${WORKER_METRICS_ADDR:-:9090}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME_WORKER:-pipelogiq-worker}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE:-true}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1}
    depends_on:
      pipelogiq-app:
        condition: service_healthy
      pipelogiq-postgres:
        condition: service_healthy
      pipelogiq-rabbitmq:
        condition: service_healthy
    # Metrics are scraped from inside the pipelogiq network.
    # ports:
    #   - "9090:9090"
    networks:
      - pipelogiq
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9090/metrics || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  tempo-data:
  grafana-data:
  rabbitmq-data:
