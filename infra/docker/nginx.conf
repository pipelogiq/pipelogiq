server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    __PIPELOGIQ_ROOT_LOCATION__

    # WebSocket proxy
    location = __PIPELOGIQ_BASE_PATH__/ws {
        proxy_pass http://localhost:8088/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header True-Client-IP "";
        proxy_read_timeout 86400;
    }

    # API proxy — strip /api prefix (mirrors Vite dev proxy)
    location __PIPELOGIQ_BASE_PATH__/api/ {
        proxy_pass http://localhost:8088/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / __PIPELOGIQ_BASE_PATH__/;
    }

    # SPA fallback
    location __PIPELOGIQ_BASE_PATH__/assets/ {
        rewrite ^__PIPELOGIQ_BASE_PATH__/(.*)$ /$1 break;
        try_files $uri =404;
    }

    location __PIPELOGIQ_BASE_PATH__/ {
        rewrite ^__PIPELOGIQ_BASE_PATH__/(.*)$ /$1 break;
        try_files $uri __PIPELOGIQ_BASE_PATH__/index.html;
        add_header Cache-Control "no-store" always;
    }
}
