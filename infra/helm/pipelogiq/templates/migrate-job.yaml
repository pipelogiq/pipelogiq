# Runs before install and before every upgrade; the rollout waits for it. A
# failed migration fails the release instead of restarting the API in a loop.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate
  labels: {{- include "pipelogiq.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    metadata:
      labels: {{- include "pipelogiq.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: "{{ .Values.image.registry }}/pipelogiq-migrate:{{ include "pipelogiq.tag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --url={{ .Values.migrate.jdbcUrl }}
            - --username={{ .Values.migrate.username }}
            - --password=$(POSTGRES_PASSWORD)
            - --searchPath=/liquibase
            - --changeLogFile=database/changelog.xml
            - update
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: POSTGRES_PASSWORD } }
