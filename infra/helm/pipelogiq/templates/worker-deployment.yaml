apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-worker
  labels: {{- include "pipelogiq.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "pipelogiq.name" . }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "pipelogiq.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: worker
          image: "{{ .Values.image.registry }}/pipelogiq-worker:{{ include "pipelogiq.tag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: metrics, containerPort: {{ .Values.metrics.worker }} }
          env:
            - { name: APP_ID, value: {{ .Values.app.appId | quote }} }
            - { name: METRICS_ADDR, value: ":{{ .Values.metrics.worker }}" }
            - { name: DATABASE_URL, valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: DATABASE_URL } } }
            - { name: RABBITMQ_URL, valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: RABBITMQ_URL } } }
            - { name: SECRETS_ENCRYPTION_KEY, valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: SECRETS_ENCRYPTION_KEY } } }
          livenessProbe:
            httpGet: { path: /metrics, port: metrics }
            periodSeconds: 15
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
